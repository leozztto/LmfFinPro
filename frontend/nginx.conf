server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo estático cai no index.html
    # (necessário para o React Router funcionar com refresh/URL direta).
    # Sem Cache-Control explícito, o navegador aplica cache heurístico a essa resposta;
    # se uma rota (ex: /api/algo) cair aqui antes de existir e só depois virar uma API de
    # verdade, o navegador reusaria esse HTML antigo em vez de bater na rede.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso: o backend só é acessível pela rede interna do docker-compose
    # (serviço "backend"), então o navegador chama /api no mesmo domínio do frontend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
