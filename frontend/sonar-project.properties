sonar.projectKey=leozztto_lmffinpro_frontend
sonar.organization=leozztto
sonar.projectName=LmfFinPro Frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/vite-env.d.ts
# Fora da métrica de cobertura por decisão consciente (não por preguiça): componentes React
# (renderização não é coberta pela suíte Vitest atual — retorno menor pro esforço), hooks que só
# encapsulam useQuery/useMutation do React Query (testá-los de verdade exigiria renderHook +
# QueryClientProvider, mesma fronteira dos componentes), wrappers de API de uma linha por feature
# (só reafirmam a própria URL, sem lógica), types.ts (tipos + mapas de label estáticos) e listas de
# dados estáticas. O que sobra fora dessas exclusões — schemas Zod, validadores, formatação,
# httpClient, authStorage, dashboard/utils — é o que realmente tem lógica e está coberto de verdade.
sonar.coverage.exclusions=src/main.tsx,\
  src/vite-env.d.ts,\
  src/**/*.tsx,\
  src/**/hooks/**,\
  src/features/**/api/**,\
  src/**/types.ts,\
  src/shared/data/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
