spring:
  application:
    name: finpro-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finpro}
    username: ${SPRING_DATASOURCE_USERNAME:finpro}
    password: ${SPRING_DATASOURCE_PASSWORD:finpro}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

# Desligado por padrão (produção): /swagger-ui e /v3/api-docs respondem 401 sem token.
# Em desenvolvimento, use SWAGGER_ENABLED=true — ver SecurityConfig.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

finpro:
  jwt:
    # Obrigatório, sem padrão: a aplicação não sobe sem JWT_SECRET (mín. 32 bytes) — ver JwtProperties.
    secret: ${JWT_SECRET:}
    # Access token curto (15 min): a sessão longa vem do refresh token abaixo.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  # Refresh token em cookie httpOnly, rotacionado a cada uso — ver RefreshTokenApplicationService.
  # REFRESH_COOKIE_SECURE=false só para HTTP fora de localhost (o navegador recusa cookie Secure).
  refresh-token:
    ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
    reuse-leeway-seconds: ${REFRESH_TOKEN_REUSE_LEEWAY_SECONDS:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Sem spring.mail.host (SPRING_MAIL_HOST) o link de redefinição só vai para o log — ver PasswordResetConfig.
  password-reset:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    mail-from: ${PASSWORD_RESET_MAIL_FROM:FinPro <no-reply@finpro.local>}
  # Rate limit por IP (filtro) e por e-mail nas rotas públicas de autenticação — ver AuthRateLimitFilter.
  # RATE_LIMIT_TRUST_PROXY_HEADER=true só quando a API é alcançável apenas pelo nginx (X-Real-IP).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-proxy-header: ${RATE_LIMIT_TRUST_PROXY_HEADER:false}
    login: { max-requests: 10, window: 15m }
    login-per-email: { max-requests: 10, window: 15m }
    register: { max-requests: 5, window: 1h }
    forgot-password: { max-requests: 5, window: 15m }
    forgot-password-per-email: { max-requests: 3, window: 1h }
  # Resumo diário de alertas (contas a vencer, orçamentos, DAS) — ver AlertScheduler.
  alerts:
    cron: ${FINPRO_ALERTS_CRON:0 0 8 * * *}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    mail-from: ${ALERTS_MAIL_FROM:${PASSWORD_RESET_MAIL_FROM:FinPro <no-reply@finpro.local>}}
  # Pasta dos anexos de transação (no Docker, o volume finpro_attachments).
  attachments:
    storage-dir: ${FINPRO_ATTACHMENTS_STORAGE_DIR:./data/attachments}
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}
    timeout-ms: ${VIACEP_TIMEOUT_MS:5000}
  # Cotação PTAX do Banco Central, para as contas e transações em outra moeda — ver
  # ExchangeRateScheduler.
  bcb-ptax:
    base-url: ${BCB_PTAX_BASE_URL:https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata}
    timeout-ms: ${BCB_PTAX_TIMEOUT_MS:8000}
  exchange-rates:
    cron: ${FINPRO_EXCHANGE_RATES_CRON:0 30 13 * * MON-FRI}

# Usado só pelos testes de contrato Pact (CategoryProviderPactTest), não pela aplicação em si.
pactbroker:
  url: ${PACT_BROKER_BASE_URL:https://lezzotto.pactflow.io}
  token: ${PACT_BROKER_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
