spring:
  application:
    name: finpro-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finpro}
    username: ${SPRING_DATASOURCE_USERNAME:finpro}
    password: ${SPRING_DATASOURCE_PASSWORD:finpro}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

finpro:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Sem spring.mail.host (SPRING_MAIL_HOST) o link de redefinição só vai para o log — ver PasswordResetConfig.
  password-reset:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    mail-from: ${PASSWORD_RESET_MAIL_FROM:FinPro <no-reply@finpro.local>}
  # Resumo diário de alertas (contas a vencer, orçamentos, DAS) — ver AlertScheduler.
  alerts:
    cron: ${FINPRO_ALERTS_CRON:0 0 8 * * *}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    mail-from: ${ALERTS_MAIL_FROM:${PASSWORD_RESET_MAIL_FROM:FinPro <no-reply@finpro.local>}}
  # Pasta dos anexos de transação (no Docker, o volume finpro_attachments).
  attachments:
    storage-dir: ${FINPRO_ATTACHMENTS_STORAGE_DIR:./data/attachments}
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}
    timeout-ms: ${VIACEP_TIMEOUT_MS:5000}
  # Cotação PTAX do Banco Central, para as contas e transações em outra moeda — ver
  # ExchangeRateScheduler.
  bcb-ptax:
    base-url: ${BCB_PTAX_BASE_URL:https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata}
    timeout-ms: ${BCB_PTAX_TIMEOUT_MS:8000}
  exchange-rates:
    cron: ${FINPRO_EXCHANGE_RATES_CRON:0 30 13 * * MON-FRI}

# Usado só pelos testes de contrato Pact (CategoryProviderPactTest), não pela aplicação em si.
pactbroker:
  url: ${PACT_BROKER_BASE_URL:https://lezzotto.pactflow.io}
  token: ${PACT_BROKER_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
