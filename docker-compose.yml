version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpro}
      POSTGRES_USER: ${POSTGRES_USER:-finpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpro}
    ports:
      - "5432:5432"
    volumes:
      - finpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finpro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finpro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finpro}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # E-mails (ex: redefinição de senha) vão para o Mailpit em dev: http://localhost:8025
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      # Resumo diário de alertas; para testar, "0 * * * * *" dispara a cada minuto.
      FINPRO_ALERTS_CRON: ${FINPRO_ALERTS_CRON:-0 0 8 * * *}
    ports:
      - "8080:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: finpro-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: finpro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  finpro_postgres_data:
