name: frontend-ci

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # O contexto `secrets` só pode ser usado em run/with/env — não em `if:` diretamente.
      # Por isso repassamos pra uma env de job e checamos `env.SONAR_TOKEN` no `if:` do passo abaixo.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_BASE_URL: https://lezzotto.pactflow.io
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud precisa do histórico completo para a análise de "new code".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - name: Test with coverage
        # Também roda os testes de contrato Pact (*.pact.test.ts), que geram frontend/pacts/*.json.
        run: npm run test:coverage --if-present
      - run: npm run build
      - name: Publish Pact contracts
        if: ${{ env.PACT_BROKER_TOKEN != '' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/pact-foundation/pact-ruby-standalone/master/install.sh | bash
          ./pact/bin/pact-broker publish pacts \
            --consumer-app-version="${{ github.sha }}" \
            --branch="${{ github.ref_name }}" \
            --broker-base-url="$PACT_BROKER_BASE_URL" \
            --broker-token="$PACT_BROKER_TOKEN"
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
