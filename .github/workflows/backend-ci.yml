name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # O contexto `secrets` só pode ser usado em run/with/env — não em `if:` diretamente.
      # Por isso repassamos pra uma env de job e checamos `env.SONAR_TOKEN` no `if:` do passo abaixo.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Lido pelo @EnabledIfEnvironmentVariable do CategoryProviderPactTest — sem o token, o próprio
      # JUnit pula a classe (não precisa de passo/if separado, ao contrário do scan do Sonar acima).
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud precisa do histórico completo para a análise de "new code".
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B sonar:sonar
